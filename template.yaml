AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MoneyWise - serverless bill splitting with Lambda + Textract

Parameters:
  EnableCdn:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Put CloudFront in front of the site (needs an AWS-verified account)

Conditions:
  UseCdn: !Equals [!Ref EnableCdn, "true"]

Globals:
  Function:
    Runtime: python3.12
    CodeUri: src/
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE: !Ref Expenses
        # Fixed name (not !Ref) so the S3 trigger doesn't create a circular dependency
        BUCKET: !Sub "${AWS::StackName}-bills-${AWS::AccountId}"

Resources:
  # ---------- storage ----------
  BillsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: expire-bill-photos
            Status: Enabled
            ExpirationInDays: 365

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

  # CloudFront: HTTPS + edge caching in front of the S3 website. New AWS accounts can't create
  # distributions until AWS verifies them, hence the switch; the API Gateway https URL works either way.
  CDN:
    Type: AWS::CloudFront::Distribution
    Condition: UseCdn
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # includes India edge locations
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !Select [2, !Split ["/", !GetAtt WebsiteBucket.WebsiteURL]]
            CustomOriginConfig: { OriginProtocolPolicy: http-only }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled: redeploys show up instantly
          Compress: true

  Expenses:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: groupId, AttributeType: S }
        - { AttributeName: expenseId, AttributeType: S }
      KeySchema:
        - { AttributeName: groupId, KeyType: HASH }
        - { AttributeName: expenseId, KeyType: RANGE }

  # ---------- API ----------
  # The API also serves the website over HTTPS: S3 website endpoints are http-only and phones refuse http.
  # GET / and GET /{proxy+} proxy to the S3 website; specific routes (/expenses, /groups/...) still win.
  # These MUST live in DefinitionBody: SAM re-imports this definition on every route change, which wipes
  # any route defined as a separate AWS::ApiGatewayV2::Route resource.
  # ponytail: CloudFront is the usual answer, but new accounts can't create it until AWS verifies them; switch once verified.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionBody:
        openapi: "3.0.1"
        info: { title: moneywise, version: "1.0" }
        paths:
          /:
            get:
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: GET
                uri: !Sub
                  - "http://${Host}/index.html"
                  - Host: !Select [2, !Split ["/", !GetAtt WebsiteBucket.WebsiteURL]]
                payloadFormatVersion: "1.0"
          /{proxy+}:
            get:
              parameters:
                - { name: proxy, in: path, required: true, schema: { type: string } }
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: GET
                uri: !Sub
                  - "http://${Host}/{proxy}"
                  - Host: !Select [2, !Split ["/", !GetAtt WebsiteBucket.WebsiteURL]]
                payloadFormatVersion: "1.0"
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, DELETE]
        AllowHeaders: [content-type]
      DefaultRouteSettings: # cheap guard against someone burning your Textract budget
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 10

  # ---------- functions ----------
  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.create_expense
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref Expenses }
        - S3WritePolicy: { BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}" }
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /expenses, Method: POST }

  ProcessBillFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.process_bill
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Expenses }
        - S3CrudPolicy: { BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: [textract:AnalyzeExpense, rekognition:DetectText]
              Resource: "*"
      Events:
        BillUploaded:
          Type: S3
          Properties:
            Bucket: !Ref BillsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: bills/ }]

  GetGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.get_group
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Expenses }
        - S3ReadPolicy: { BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}" } # signs photo links
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: "/groups/{group}", Method: GET }

  DeleteExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.delete_expense
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Expenses }
        - S3CrudPolicy: { BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}" } # deletes the photo too
      Events:
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: "/groups/{group}/expenses/{id}", Method: DELETE }

  DeleteGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.delete_group
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Expenses }
        - S3CrudPolicy: { BucketName: !Sub "${AWS::StackName}-bills-${AWS::AccountId}" }
      Events:
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: "/groups/{group}", Method: DELETE }

  AssignItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.assign_items
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Expenses }
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: "/groups/{group}/expenses/{id}/items", Method: POST }

  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.update_members
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Expenses }
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: "/groups/{group}/members", Method: POST }

Outputs:
  AppUrl:
    Value: !If [UseCdn, !Sub "https://${CDN.DomainName}/", !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/"]
  WebsiteUrl:
    Value: !GetAtt WebsiteBucket.WebsiteURL
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
